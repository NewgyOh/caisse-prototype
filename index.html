 L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"],
 G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"],
 RR=L.map(s=>[...s].map(d=>d^1).join("")),P=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function bars(c){let b="101";for(let i=1;i<7;i++)b+=(P[c[0]][i-1]=="L"?L:G)[c[i]];b+="01010";for(let i=7;i<13;i++)b+=RR[c[i]];b+="101";
 let d="";[...b].forEach((k,x)=>{if(k=="1")d+=`M${x} 0h1v46h-1z`});
 return `<svg viewBox="-9 0 113 58" width="150"><path d="${d}"/><text x="47" y="56" text-anchor="middle" font-size="9">${c}</text></svg>`}
// ---- navigation
function go(v){view=v;document.body.dataset.m=MODE;$("#nav").innerHTML=`<button class=md onclick="switchMode()">${MODE=="demo"?"🎓 DÉMO":"🏪 RÉEL"} ⇄</button>`+[["caisse","🧾 Caisse"],["stock","📦 Stock"],["ventes","📊 Ventes"],["reg","⚙️ Réglages"]].map(([k,l])=>`<button class="${k==v?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
 if(!S.cats.includes(cat))cat=S.cats[0];$("#app").innerHTML=R[v]();
 if(v=="caisse"){draw();if(matchMedia("(pointer:fine)").matches&&!D.open)$("#scan").focus()}}
onkeydown=e=>{if(view=="caisse"&&!D.open&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key.length==1)$("#scan")?.focus()};
// ---- caisse
R.caisse=()=>`<div class=cols><section><div class=tabs>${S.cats.map((c,i)=>`<button class="${c==cat?"on":""}" onclick="cat=S.cats[${i}];go('caisse')">${esc(c)}</button>`).join("")}</div>
<div class=grid>${S.items.filter(i=>i.cat==cat).map(i=>`<button class="p ${i.stock<1?"out":""}" onclick="scan('${i.code}')"><b>${i.icon}</b>${esc(i.name)}<br>${eur(i.price)}<small>stock ${i.stock}</small></button>`).join("")||"<p>Aucun article ici : ajoutez-en dans l'onglet Stock.</p>"}</div></section>
<aside class=tk><div class=row><input id=scan placeholder="Scanner ou saisir un code-barres, puis Entrée" inputmode=numeric onkeydown="if(event.key=='Enter'){scan(this.value.trim());this.value=''}"><button style="flex:0" onclick="cam()">📷</button></div>
<div id=msg></div><div id=lines></div><div class=tot id=tot></div><div class=row><button onclick="cart={};draw()">Tout annuler</button><button class=ok onclick="pay()">ENCAISSER</button></div></aside></div>`;
function scan(c){const i=item(c);if(!i)return msg("Code inconnu : "+c,1);const q=(cart[c]||0)+1;if(q>i.stock)return msg(`Stock insuffisant : ${i.name} (reste ${i.stock})`,1);cart[c]=q;msg(`${i.icon} ${i.name} ajouté`);draw()}
function draw(){if(!$("#lines"))return;$("#lines").innerHTML=Object.entries(cart).map(([c,q])=>{const i=item(c);return `<div class=ln><span>${i.icon} ${esc(i.name)}</span><span><button onclick="qty('${c}',-1)">−</button> ${q} <button onclick="qty('${c}',1)">+</button></span><b>${eur(i.price*q)}</b></div>`}).join("");$("#tot").textContent=eur(tot())}
function qty(c,d){const q=(cart[c]||0)+d;if(q<1)delete cart[c];else if(q<=item(c).stock)cart[c]=q;else msg("Stock insuffisant",1);draw()}
function pay(){const t=tot();if(!t)return;box(`<h2>À payer : ${eur(t)}</h2><div class=row>${["Espèces","Carte","Chèque"].map(m=>`<button onclick="mode('${m}')">${m}</button>`).join("")}</div>`)}
function mode(m){const t=tot();if(m!="Espèces")return done(m,t);
 box(`<h2>Espèces : ${eur(t)}</h2><div class=pad><label>Somme donnée par le client (€)</label><input id=dn type=number step=0.01 min=0 inputmode=decimal oninput="chg()" autofocus>
 <div class=row>${[5,10,20,50,100,200].map(v=>`<button onclick="addm(${v})">+${v}</button>`).join("")}</div><div id=rd class=big></div><button class=ok id=vb disabled onclick="done('Espèces',Math.round(+dn.value*100))">Valider le paiement</button></div>`);chg()}
function chg(){const r=Math.round((+dn.value||0)*100)-tot();rd.textContent=r>=0?"À rendre : "+eur(r):"Il manque "+eur(-r);vb.disabled=r<0||!dn.value}
const addm=v=>{dn.value=((Math.round((+dn.value||0)*100)+v*100)/100);chg()};
function done(m,g){const t=tot(),l=Object.entries(cart).map(([c,q])=>{const i=item(c);i.stock-=q;return{c,n:i.name,q,p:i.price,v:i.tva}});
 const s={n:++S.n,d:Date.now(),l,t,m,g,r:g-t};S.sales.push(s);save();cart={};D.close();go("caisse");ticket(s)}
function ticket(s){const v={},w="-".repeat(32);s.l.forEach(x=>v[x.v]=(v[x.v]||0)+x.p*x.q);
 box(`<pre>${esc((S.shop||(MODE=="demo"?"Caisse de démonstration":"Mon magasin")).toUpperCase())}\n${new Date(s.d).toLocaleString("fr-FR")}\nTicket n° ${String(s.n).padStart(4,"0")}\n${w}\n${s.l.map(x=>(x.q+" x "+x.n).padEnd(21).slice(0,21)+eur(x.p*x.q).padStart(11)).join("\n")}\n${w}\n${"TOTAL TTC".padEnd(21)}${eur(s.t).padStart(11)}\n${Object.entries(v).map(([k,a])=>`TVA ${k}% : ${eur(Math.round(a-a/(1+k/100)))}`).join("\n")}\nPayé : ${s.m}${s.m=="Espèces"?`\nDonné ${eur(s.g)} - Rendu ${eur(s.r)}`:""}</pre>
 <div class="row noprint"><button onclick="print()">🖨 Imprimer</button><button class=ok onclick="D.close()">Client suivant</button></div>`)}
// ---- caméra (BarcodeDetector : Chrome/Android, HTTPS requis)
let st,tm;async function cam(){const v=$("#vid");if(st){st.getTracks().forEach(t=>t.stop());st=0;clearInterval(tm);v.hidden=1;return}
 if(!("BarcodeDetector"in window)||!navigator.mediaDevices)return msg("Caméra non disponible ici (HTTPS + Chrome/Android requis). Utilisez un lecteur USB.",1);
 try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=st;v.hidden=0;await v.play();
  const d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","code_128"]});let last="",lt=0;
  tm=setInterval(async()=>{const r=await d.detect(v).catch(()=>[]);if(r[0]){const c=r[0].rawValue,n=Date.now();if(c!=last||n-lt>2000){last=c;lt=n;scan(c)}}},300)}catch(e){msg("Caméra refusée : "+e.message,1)}}
// ---- stock
R.stock=()=>`<div class=pad><div class=row><button class=ok onclick="edit()">＋ Article</button><button onclick="addCat()">＋ Catégorie</button><button onclick="etiquettes()">🏷 Étiquettes code-barres</button></div>
<div class=tabs>${S.cats.map((c,i)=>`<span class=chip>${esc(c)} <a onclick="renCat(${i})">✎</a><a onclick="delCat(${i})">✕</a></span>`).join("")}</div>
<div style="overflow:auto"><table><tr><th></th><th>Article</th><th>Code-barres</th><th>Catégorie</th><th>Prix</th><th>TVA</th><th>Stock</th><th></th></tr>${S.items.map(i=>`<tr class="${i.stock<=5?"low":""}"><td>${i.icon}</td><td>${esc(i.name)}</td><td>${i.code}</td><td>${esc(i.cat)}</td><td>${eur(i.price)}</td><td>${i.tva}%</td>
<td style="white-space:nowrap"><button onclick="adj('${i.code}',-1)">−</button> ${i.stock} <button onclick="adj('${i.code}',1)">+</button> <button onclick="adj('${i.code}',10)">+10</button></td><td><a onclick="edit('${i.code}')">✎</a><a onclick="del('${i.code}')">🗑</a></td></tr>`).join("")}</table></div></div>`;
function adj(c,d){const y=$("#app").scrollTop,i=item(c);i.stock=Math.max(0,i.stock+d);save();go("stock");$("#app").scrollTop=y}
function del(c){yes("Supprimer cet article ?",()=>{S.items=S.items.filter(i=>i.code!=c);delete cart[c];save();go("stock")})}
function addCat(){ask("Nom de la nouvelle catégorie","",n=>{if(!n)return;if(S.cats.includes(n))return info("Cette catégorie existe déjà.");S.cats.push(n);save();go(view)})}
function renCat(i){ask("Nouveau nom de la catégorie",S.cats[i],n=>{if(!n||S.cats.includes(n))return;S.items.forEach(x=>{if(x.cat==S.cats[i])x.cat=n});S.cats[i]=n;save();go(view)})}
function delCat(i){if(S.items.some(x=>x.cat==S.cats[i]))return info("Déplacez ou supprimez d'abord les articles de cette catégorie.");if(S.cats.length<2)return info("Il faut garder au moins une catégorie.");yes("Supprimer la catégorie ?",()=>{S.cats.splice(i,1);save();go(view)})}
function edit(c){const i=item(c)||{name:"",price:0,tva:5.5,cat:S.cats[0],icon:"📦",stock:MODE=="demo"?10:0,code:""};
 box(`<h2>${c?"Modifier l'article":"Nouvel article"}</h2><form class=form onsubmit="return saveItem(event,'${c||""}')">
 <input name=name value="${esc(i.name)}" placeholder="Nom" required><input name=price type=number step=0.01 min=0 value="${i.price/100}" placeholder="Prix TTC (€)" required>
 <label>TVA (%)</label><select name=tva>${[5.5,10,20,2.1,0].map(v=>`<option ${v==i.tva?"selected":""}>${v}</option>`).join("")}</select>
 <label>Catégorie</label><select name=cat>${S.cats.map(k=>`<option ${k==i.cat?"selected":""}>${esc(k)}</option>`).join("")}</select>
 <label>Stock disponible</label><input name=stock type=number min=0 value="${i.stock}"><input name=code value="${i.code}" placeholder="Code-barres (vide = généré automatiquement)" inputmode=numeric>
 <label>Icône (choisir ou coller un emoji)</label><input name=icon id=ic value="${i.icon}" style="font-size:28px;width:110px"><div class=emo>${EMO.map(e=>`<button type=button onclick="ic.value='${e}'">${e}</button>`).join("")}</div>
 <div id=fe class=err></div><div class=row><button class=ok>Enregistrer</button><button type=button onclick="D.close()">Annuler</button></div></form>`)}
function saveItem(e,old){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));let code=o.code.replace(/\W/g,"");
 if(!code)do{code=gen()}while(item(code));else if(/^\d{12}$/.test(code))code+=chk(code);
 if(item(code)&&code!=old){fe.textContent="Ce code-barres existe déjà.";return false}
 const n={code,name:o.name.trim(),price:Math.round(o.price*100),tva:+o.tva,cat:o.cat,icon:o.icon||"📦",stock:+o.stock},k=S.items.findIndex(i=>i.code==old);
 k<0?S.items.push(n):S.items[k]=n;if(code!=old&&cart[old]){cart[code]=cart[old];delete cart[old]}save();D.close();return false}
function etiquettes(){box(`<div class="row noprint"><button onclick="print()">🖨 Imprimer</button><button onclick="D.close()">Fermer</button></div><div class=lab>${S.items.filter(i=>/^\d{13}$/.test(i.code)).map(i=>`<div>${i.icon} ${esc(i.name)} - ${eur(i.price)}<br>${bars(i.code)}</div>`).join("")}</div>`)}
// ---- ventes et réglages
R.ventes=()=>`<div class=pad><h2>${S.sales.length} vente(s) - CA ${eur(S.sales.reduce((a,s)=>a+s.t,0))}</h2><div class=row><button onclick="csv()">⬇ Exporter en CSV</button></div>
<table><tr><th>N°</th><th>Date</th><th>Articles</th><th>Mode</th><th>Total</th></tr>${S.sales.slice().reverse().map(s=>`<tr onclick="ticket(S.sales.find(x=>x.n==${s.n}))"><td>${s.n}</td><td>${new Date(s.d).toLocaleString("fr-FR")}</td><td>${s.l.reduce((a,x)=>a+x.q,0)}</td><td>${s.m}</td><td>${eur(s.t)}</td></tr>`).join("")}</table></div>`;
function csv(){const t="n;date;mode;total;articles\n"+S.sales.map(s=>[s.n,new Date(s.d).toISOString(),s.m,s.t/100,s.l.map(x=>x.q+"x"+x.n).join(" | ")].join(";")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="ventes.csv";a.click()}
R.reg=()=>`<div class=pad><h2>Réglages : ${MODE=="demo"?"mode démo":"mode réel"}</h2>
<p>${MODE=="demo"?"Catalogue de démonstration (fruits, légumes, vêtements…) pour s'entraîner. Aucun lien avec le mode réel.":"Magasin réel : articles, stock et ventes 100 % manuels, séparés du mode démo."}</p>
<input value="${esc(S.shop||"")}" placeholder="Nom du magasin (affiché sur le ticket)" onchange="S.shop=this.value;save()">
<div class=row><button onclick="switchMode()">⇄ Passer en mode ${MODE=="demo"?"réel":"démo"}</button><button onclick="exp()">⬇ Sauvegarder ce mode (JSON)</button><div class=restore-area><label for=backupFile>⬆ Restaurer une sauvegarde</label><input id=backupFile type=file accept=".json,application/json" onchange="const f=this.files&&this.files[0];if(f)imp(f);this.value=''"></div></div>
<button onclick="reset()">${MODE=="demo"?"↺ Remettre le catalogue de démonstration":"🗑 Vider le magasin réel (articles, stock, ventes)"}</button></div>`;
function reset(){yes(MODE=="demo"?"Remettre le catalogue de démonstration, les stocks et vider les ventes ?":"Supprimer TOUS les articles, le stock et les ventes du mode réel ?",()=>{try{localStorage.removeItem(K(MODE));localStorage.removeItem("caisse.v1")}catch(e){}load(MODE);go("reg")})}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="caisse-sauvegarde.json";a.click()}
function imp(f){
 if(!f)return;
 const r=new FileReader();
 r.onerror=()=>info("Impossible de lire ce fichier. Réessayez.");
 r.onload=()=>{
  try{
   const data=JSON.parse(r.result);
   if(!data||typeof data!=="object"||!Array.isArray(data.cats)||
      !Array.isArray(data.items)||!Array.isArray(data.sales)||
      !Number.isFinite(Number(data.n))||
      !data.items.every(i=>i&&typeof i==="object"&&typeof i.code==="string"&&
        typeof i.name==="string"&&Number.isFinite(Number(i.price))&&
        Number.isFinite(Number(i.stock)))||
      !data.sales.every(s=>s&&typeof s==="object"&&Array.isArray(s.l))){
     info("Sauvegarde invalide ou incompatible. Aucune donnée n'a été modifiée.");
     return;
   }
   localStorage.setItem(K(MODE),JSON.stringify(data));
   S=data;
   location.reload();
  }catch(e){
   info(e instanceof SyntaxError
    ?"Fichier JSON invalide. Vérifiez que c'est une sauvegarde de la caisse."
    :"Restauration impossible ("+(e&&e.name?e.name:"erreur")+"). Vérifiez les autorisations de stockage du site et réessayez. Les données existantes n'ont pas été remplacées.");
  }
 };
 r.readAsText(f);
}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js?v=4",{updateViaCache:"none"}).then(r=>r.update()).catch(e=>console.warn("Service worker :",e));
go("caisse");
</script></body></html>
